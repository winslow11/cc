<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公文格式自动排版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#1a3a5c,#2a5a8c);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:500;letter-spacing:1px}
.header .badge{font-size:11px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px}
.container{max-width:1400px;margin:0 auto;padding:18px}
.columns{display:flex;gap:18px;min-height:70vh}
.col{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;flex:1;display:flex;flex-direction:column}
.col-header{padding:12px 18px;font-size:13px;font-weight:600;border-bottom:1px solid #e8e8e8;background:#fafafa;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%}.dot-blue{background:#1890ff}.dot-green{background:#52c41a}
.col-body{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.8}
.drop-zone{border:2px dashed #d9d9d9;border-radius:8px;padding:36px 18px;text-align:center;cursor:pointer;transition:all .3s;background:#fafafa;margin:8px}
.drop-zone:hover,.drop-zone.dragover{border-color:#1890ff;background:#e6f7ff}
.drop-zone .icon{font-size:36px;margin-bottom:8px}
.drop-zone .hint{font-size:12px;color:#999;margin-top:4px}
.drop-zone input{display:none}

.para-item{padding:5px 8px;margin:2px 0;border-radius:3px;border-left:3px solid transparent;font-size:13px;line-height:1.7}
.para-item:hover{background:#fafafa}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;margin-right:5px;font-weight:600;vertical-align:middle;min-width:32px;text-align:center}
.tag-h1{background:#1a3a5c;color:#fff}.tag-h2{background:#2a5a8c;color:#fff}
.tag-h3{background:#1890ff;color:#fff}.tag-h4{background:#722ed1;color:#fff}
.tag-h5{background:#eb2f96;color:#fff}.tag-body{background:#f0f0f0;color:#666}
.tag-fig{background:#faad14;color:#fff}.tag-tbl{background:#52c41a;color:#fff}
.b-h1{border-left-color:#1a3a5c}.b-h2{border-left-color:#2a5a8c}
.b-h3{border-left-color:#1890ff}.b-h4{border-left-color:#722ed1}
.b-h5{border-left-color:#eb2f96}.b-fig{border-left-color:#faad14}.b-tbl{border-left-color:#52c41a}

.pv-h1{font-family:"SimHei","黑体",sans-serif;font-size:16pt;font-weight:700;margin:6px 0 3px}
.pv-h2{font-family:"KaiTi","楷体",serif;font-size:16pt;margin:5px 0 2px}
.pv-h3{font-family:"FangSong","仿宋",serif;font-size:16pt;font-weight:700;margin:4px 0 2px}
.pv-h4{font-family:"FangSong","仿宋",serif;font-size:16pt;font-weight:700;text-indent:2em;margin:2px 0}
.pv-h5{font-family:"FangSong","仿宋",serif;font-size:16pt;text-indent:2em;margin:2px 0}
.pv-body{font-family:"FangSong","仿宋",serif;font-size:16pt;text-indent:2em;margin:2px 0}
.pv-fig{font-family:"FangSong","仿宋",serif;font-size:10.5pt;text-indent:2em;color:#999}
.pv-tbl{margin:6px 0;padding:6px 10px;background:#fafafa;border:1px solid #e0e0e0;border-radius:4px;font-size:10.5pt}
.pv-tbl .r{display:flex;padding:2px 0;border-bottom:1px dotted #eee}
.pv-tbl .k{width:90px;color:#666;text-align:right;padding-right:10px;flex-shrink:0}
.pv-tbl .v{flex:1}
.empty{text-align:center;color:#bbb;padding:50px 16px}
.empty .icon{font-size:40px;margin-bottom:10px}
.err{text-align:center;color:#e74c3c;padding:20px 16px;background:#fef2f2;border-radius:6px;margin:8px 0;font-size:13px}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid #e8e8e8;background:#fafafa;border-radius:0 0 10px 10px}
.btn{padding:9px 20px;border:none;border-radius:5px;font-size:13px;cursor:pointer;font-weight:500;transition:all .2s}
.btn-primary{background:#1890ff;color:#fff}.btn-primary:hover{background:#40a9ff}
.btn-primary:disabled{background:#d9d9d9;cursor:not-allowed}
.btn-success{background:#52c41a;color:#fff}.btn-success:hover{background:#73d13d}
.btn-success:disabled{background:#d9d9d9;cursor:not-allowed}
.btn-outline{background:#fff;color:#666;border:1px solid #d9d9d9}
.btn-outline:hover{border-color:#1890ff;color:#1890ff}
.stats{font-size:12px;color:#888;margin-left:auto}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:5px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:900px){.columns{flex-direction:column}.col{min-height:35vh}}
</style>
</head>
<body>

<div class="header">
  <h1>📄 公文格式自动排版</h1>
  <span class="badge">GB/T 9704 · 完全离线 · 纯前端</span>
</div>

<div class="container">
<div class="columns">

<div class="col">
  <div class="col-header"><span class="dot dot-blue"></span>源文档 — 层级自动检测</div>
  <div id="dropZone" class="drop-zone">
    <div class="icon">📁</div>
    <div>点击此处或拖拽 <strong>.docx</strong> 文件上传</div>
    <div class="hint">支持 Word 2007+ · 文件仅在本机处理 · 完全离线</div>
    <input type="file" id="fileInput" accept=".docx">
  </div>
  <div class="col-body" id="sourcePreview"><div class="empty"><div class="icon">📂</div>上传 .docx 文件后显示层级检测结果</div></div>
</div>

<div class="col">
  <div class="col-header"><span class="dot dot-green"></span>格式化预览 — 公文样式</div>
  <div class="col-body" id="formatPreview"><div class="empty"><div class="icon">👁</div>上传文件后显示排版效果</div></div>
</div>

</div>

<div class="toolbar" id="toolbar"><span style="color:#bbb">等待上传文件...</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
//  ZIP 引擎（零依赖）
// ═══════════════════════════════════════

function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.innerHTML = '<div class="err"><strong>❌ ' + msg + '</strong></div>';
}

async function unzipOne(file, entryPath) {
  const buf = await file.arrayBuffer();
  const dv = new DataView(buf);

  // 找 EOCD
  let eocdOff = -1;
  const searchStart = Math.max(0, dv.byteLength - 65557); // EOCD + max comment
  for (let i = dv.byteLength - 22; i >= searchStart; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocdOff = i; break; }
  }
  if (eocdOff < 0) throw new Error('无法解析 ZIP 格式，请确认是标准 .docx 文件');

  const totalEntries = dv.getUint16(eocdOff + 10, true);
  const cdOff = dv.getUint32(eocdOff + 16, true);

  let pos = cdOff;
  for (let i = 0; i < totalEntries; i++) {
    if (dv.getUint32(pos, true) !== 0x02014b50) throw new Error('ZIP 中央目录损坏');
    const compMethod = dv.getUint16(pos + 10, true);
    const compSize = dv.getUint32(pos + 20, true);
    const fnLen = dv.getUint16(pos + 28, true);
    const extraLen = dv.getUint16(pos + 30, true);
    const commentLen = dv.getUint16(pos + 32, true);
    const localOff = dv.getUint32(pos + 42, true);

    const fnBytes = new Uint8Array(buf.slice(pos + 46, pos + 46 + fnLen));
    const fn = new TextDecoder().decode(fnBytes);

    if (fn === entryPath || fn.endsWith('/' + entryPath)) {
      let lp = localOff;
      const lfnLen = dv.getUint16(lp + 26, true);
      const lExtraLen = dv.getUint16(lp + 28, true);
      const dataOff = lp + 30 + lfnLen + lExtraLen;
      const raw = new Uint8Array(buf.slice(dataOff, dataOff + compSize));

      if (compMethod === 0) {
        return new TextDecoder().decode(raw);
      } else if (compMethod === 8) {
        // DEFLATE — 用浏览器原生 API 解压
        const blob = new Blob([raw]);
        const ds = new DecompressionStream('deflate');
        const decompressedStream = blob.stream().pipeThrough(ds);
        const resultBuf = await new Response(decompressedStream).arrayBuffer();
        return new TextDecoder().decode(resultBuf);
      } else {
        throw new Error('不支持的压缩方式: ' + compMethod);
      }
    }
    pos += 46 + fnLen + extraLen + commentLen;
  }
  throw new Error('文档中未找到 ' + entryPath);
}

// CRC32
function crc32(data) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) { crc ^= data[i]; for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0); }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// 生成下载用的 ZIP
function makeZip(files) {
  const te = new TextEncoder();
  const parts = [], cdParts = [];
  let cdOff = 0;

  for (const [name, content] of Object.entries(files)) {
    const data = te.encode(content);
    const nameBytes = te.encode(name);
    const crc = crc32(data);

    // Local header
    const lh = new ArrayBuffer(30 + nameBytes.length);
    const lhDv = new DataView(lh);
    lhDv.setUint32(0, 0x04034b50, true);
    lhDv.setUint16(8, 0, true);  // STORE
    lhDv.setUint32(14, crc, true);
    lhDv.setUint32(18, data.length, true);
    lhDv.setUint32(22, data.length, true);
    lhDv.setUint16(26, nameBytes.length, true);
    const lhArr = new Uint8Array(lh); lhArr.set(nameBytes, 30);
    parts.push(lhArr, data);

    // Central directory
    const cd = new ArrayBuffer(46 + nameBytes.length);
    const cdDv = new DataView(cd);
    cdDv.setUint32(0, 0x02014b50, true);
    cdDv.setUint32(16, crc, true);
    cdDv.setUint32(20, data.length, true);
    cdDv.setUint32(24, data.length, true);
    cdDv.setUint16(28, nameBytes.length, true);
    cdDv.setUint32(42, cdOff, true);
    const cdArr = new Uint8Array(cd); cdArr.set(nameBytes, 46);
    cdParts.push(cdArr);
    cdOff += 30 + nameBytes.length + data.length;
  }

  const cdBlob = new Blob(cdParts);
  const cdArray = new Uint8Array(cdBlob.arrayBuffer ? cdBlob.arrayBuffer() : await cdBlob.arrayBuffer());
  // Actually need to await this
  return cdBlob.arrayBuffer().then(cdBuf => {
    const cdArr2 = new Uint8Array(cdBuf);
    const eocd = new ArrayBuffer(22);
    const dv = new DataView(eocd);
    dv.setUint32(0, 0x06054b50, true);
    const n = Object.keys(files).length;
    dv.setUint16(8, n, true); dv.setUint16(10, n, true);
    dv.setUint32(12, cdArr2.length, true);
    dv.setUint32(16, cdOff, true);

    parts.push(cdArr2);
    parts.push(new Uint8Array(eocd));
    return new Blob(parts, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  });
}

// ═══════════════════════════════════════
//  读取 docx 段落
// ═══════════════════════════════════════

function escXml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function extractParagraphs(file) {
  const xml = await unzipOne(file, 'word/document.xml');
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'text/xml');
  const ns = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

  const paras = [];
  function walk(node) {
    for (const child of node.children) {
      const local = child.localName;
      if (local === 'p') {
        const texts = [];
        let hasBold = false;
        for (const t of child.getElementsByTagNameNS(ns, 't')) {
          if (t.textContent) texts.push(t.textContent);
        }
        if (child.getElementsByTagNameNS(ns, 'b').length > 0 || child.querySelector('[w\\:b]')) hasBold = true;
        const text = texts.join('').trim();
        if (text) {
          let inTable = false, n = child.parentNode;
          while (n && n !== node) {
            if (n.localName === 'tc') { inTable = true; break; }
            n = n.parentNode;
          }
          if (!inTable) paras.push({ text, len: text.length, bold: hasBold });
        }
      } else if (local === 'tbl') {
        const kvs = [];
        for (const tr of child.getElementsByTagNameNS(ns, 'tr')) {
          const cells = tr.getElementsByTagNameNS(ns, 'tc');
          if (cells.length >= 2) {
            const k = (cells[0].textContent || '').trim();
            const v = (cells[1].textContent || '').trim();
            if (k && v) kvs.push([k, v]);
          }
        }
        if (kvs.length >= 2) paras.push({ text: '', len: 0, bold: false, _isTable: true, _kvs: kvs });
      } else {
        walk(child);
      }
    }
  }

  const body = doc.getElementsByTagNameNS(ns, 'body')[0];
  if (body) walk(body);
  return paras;
}

// ═══════════════════════════════════════
//  层级检测
// ═══════════════════════════════════════

const RE_H1=/^[一二三四五六七八九十]+[、．.]/;
const RE_H2=/^（[一二三四五六七八九十]+）/;
const RE_H3=/^\d+[\.．、]\s*\S/;
const RE_H4=/^（\d+）/;
const RE_H5=/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/;
const RE_FIG=/^图\s*\d+/;
const RE_DATE=/^\d{4}年\d{1,2}月\d{1,2}日/;
const RE_KV=/^[^：:]{1,20}[：:].{1,40}$/;

function cleanText(s) {
  return s.replace(/》(、|，|,)《/g,'》《').replace(/"(、|，|,)"/g,'""').trim();
}

function detectLev(text, tlen, bold, prev, nextLen) {
  if(RE_FIG.test(text)&&tlen<=50)return -1;
  if(RE_KV.test(text)&&tlen<=50)return -2;
  if(RE_H5.test(text))return 5;
  if(RE_H4.test(text))return 4;
  if(RE_H3.test(text)&&tlen<=30)return 3;
  if(RE_H2.test(text))return 2;
  if(RE_H1.test(text))return 1;
  if(tlen<=18&&nextLen&&nextLen>40){if(!RE_DATE.test(text)&&!RE_FIG.test(text)){if(prev&&prev>=1)return Math.min(prev+1,5);return 2;}}
  if(tlen<=20&&bold)return 2;
  if(tlen>18&&tlen<=35&&nextLen&&nextLen>60){if(!RE_DATE.test(text)&&!RE_KV.test(text))return 2;}
  return 0;
}

function collectKV(paras,start){
  const kvs=[];let i=start;
  while(i<paras.length){const m=paras[i].text.match(RE_KV);if(m&&paras[i].len<=50){const idx=paras[i].text.search(/[：:]/);if(idx>0){kvs.push([paras[i].text.slice(0,idx).trim(),paras[i].text.slice(idx+1).trim()]);i++;continue;}}break;}
  return{kvs,endIdx:i};
}

function analyze(paras){
  const levels=[];
  for(let i=0;i<paras.length;i++){
    const p=paras[i];
    if(p._isTable){levels.push(['table',p._kvs]);continue;}
    const nextLen=i+1<paras.length?paras[i+1].len:null;
    const prev=levels.length>0?levels[levels.length-1][0]:null;
    levels.push([detectLev(p.text,p.len,p.bold,prev,nextLen),cleanText(p.text)]);
  }
  const merged=[];let i=0;
  while(i<levels.length){const[l,t]=levels[i];if(l===-2){const{kvs,endIdx}=collectKV(paras,i);if(kvs.length>=2){merged.push(['table',kvs]);i=endIdx;continue;}}merged.push([l,t]);i++;}
  return merged;
}

// ═══════════════════════════════════════
//  docx 生成
// ═══════════════════════════════════════

function makeDocumentXml(merged){
  const FH='黑体',FK='楷体_GB2312',FB='仿宋_GB2312',SZ='32',ST='21',LN='560',IND='640';
  let body='';
  for(const[lv,item] of merged){
    if(lv==='table'){
      body+='<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders><w:top w:val="single" w:sz="4"/><w:left w:val="single" w:sz="4"/><w:bottom w:val="single" w:sz="4"/><w:right w:val="single" w:sz="4"/><w:insideH w:val="single" w:sz="4"/><w:insideV w:val="single" w:sz="4"/></w:tblBorders></w:tblPr><w:tblGrid><w:gridCol w:w="2500"/><w:gridCol w:w="2500"/></w:tblGrid>';
      for(const[k,v] of item){
        body+='<w:tr><w:tc><w:tcPr><w:shd w:val="clear" w:fill="F2F2F2"/></w:tcPr><w:p><w:pPr><w:spacing w:line="360" w:lineRule="exact" w:before="0" w:after="0"/><w:jc w:val="right"/></w:pPr><w:r><w:rPr><w:rFonts w:eastAsia="'+FB+'"/><w:sz w:val="'+ST+'"/><w:b/></w:rPr><w:t xml:space="preserve">'+escXml(k)+'</w:t></w:r></w:p></w:tc><w:tc><w:p><w:pPr><w:spacing w:line="360" w:lineRule="exact" w:before="0" w:after="0"/></w:pPr><w:r><w:rPr><w:rFonts w:eastAsia="'+FB+'"/><w:sz w:val="'+ST+'"/></w:rPr><w:t xml:space="preserve">'+escXml(v)+'</w:t></w:r></w:p></w:tc></w:tr>';
      }
      body+='</w:tbl><w:p><w:pPr><w:spacing w:line="'+LN+'" w:lineRule="exact" w:before="0" w:after="0"/></w:pPr></w:p>';
      continue;
    }
    let fnt=FB,sz=SZ,bld='',ind=' w:firstLine="'+IND+'"';
    switch(lv){case 1:fnt=FH;ind='';break;case 2:fnt=FK;ind='';break;case 3:bld='<w:b/>';ind='';break;case 4:bld='<w:b/>';break;case 5:break;case -1:sz=ST;break;}
    body+='<w:p><w:pPr><w:spacing w:line="'+LN+'" w:lineRule="exact" w:before="0" w:after="0"/>'+(ind?'<w:ind'+ind+'/>':'')+'</w:pPr><w:r><w:rPr><w:rFonts w:eastAsia="'+fnt+'" w:ascii="'+fnt+'"/><w:sz w:val="'+sz+'"/>'+bld+'</w:rPr><w:t xml:space="preserve">'+escXml(item)+'</w:t></w:r></w:p>';
  }
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2098" w:bottom="1984" w:left="1588" w:right="1474"/></w:sectPr></w:body></w:document>';
}

async function buildDocxBlob(merged){
  return makeZip({
    '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>',
    '_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',
    'word/_rels/document.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/></Relationships>',
    'word/document.xml':makeDocumentXml(merged),
    'word/styles.xml':'<?xml version="1.0" encoding="UTF-8"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:eastAsia="仿宋_GB2312" w:ascii="仿宋_GB2312"/><w:sz w:val="32"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:line="560" w:lineRule="exact" w:before="0" w:after="0"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>',
    'word/settings.xml':'<?xml version="1.0" encoding="UTF-8"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:compat><w:overflowPunct w:val="false"/><w:topLinePunct w:val="false"/></w:compat></w:settings>',
  });
}

// ═══════════════════════════════════════
//  UI
// ═══════════════════════════════════════

const LV={1:'一级',2:'二级',3:'三级',4:'四级',5:'五级',0:'正文','-1':'图注','table':'表格'};
const TC={1:'tag-h1',2:'tag-h2',3:'tag-h3',4:'tag-h4',5:'tag-h5',0:'tag-body','-1':'tag-fig','table':'tag-tbl'};
const BC={1:'b-h1',2:'b-h2',3:'b-h3',4:'b-h4',5:'b-h5','-1':'b-fig','table':'b-tbl'};
const PV={1:'pv-h1',2:'pv-h2',3:'pv-h3',4:'pv-h4',5:'pv-h5','-1':'pv-fig'};

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

let cur=null, fname='document';

function renderSource(merged){
  const el=document.getElementById('sourcePreview');el.innerHTML='';
  for(const[l,item] of merged){
    const d=document.createElement('div');d.className='para-item '+(BC[l]||'');
    const tag=document.createElement('span');tag.className='tag '+(TC[l]||'tag-body');tag.textContent=LV[l]||'正文';d.appendChild(tag);
    if(l==='table'){for(const[k,v] of item)d.appendChild(document.createTextNode(k+'：'+v+'  '));}
    else d.appendChild(document.createTextNode(item));
    el.appendChild(d);
  }
}

function renderPreview(merged){
  const el=document.getElementById('formatPreview');el.innerHTML='';
  for(const[l,item] of merged){
    if(l==='table'){
      const d=document.createElement('div');d.className='pv-tbl';
      for(const[k,v] of item){const r=document.createElement('div');r.className='r';const ks=document.createElement('span');ks.className='k';ks.textContent=k;const vs=document.createElement('span');vs.className='v';vs.textContent=v;r.appendChild(ks);r.appendChild(vs);d.appendChild(r);}
      el.appendChild(d);
    }else{const d=document.createElement('div');d.className=PV[l]||'pv-body';d.textContent=item;el.appendChild(d);}
  }
}

function updateToolbar(){
  const tb=document.getElementById('toolbar');
  if(!cur){tb.innerHTML='<span style="color:#bbb">等待上传文件...</span>';return;}
  const cnt={};for(const[l] of cur){const k=LV[l]||'?';cnt[k]=(cnt[k]||0)+1;}
  const s=Object.entries(cnt).map(([k,v])=>k+'×'+v).join(' · ');
  tb.innerHTML='<button class="btn btn-outline" onclick="resetAll()">🔄 重新上传</button><button class="btn btn-success" id="btnDownload" onclick="doDownload()">⬇ 导出格式化文档</button><span class="stats">检测：'+s+'　|　共 '+cur.length+' 个内容块</span>';
}

async function processFile(file){
  if(!file.name.toLowerCase().endsWith('.docx')){showToast('⚠ 仅支持 .docx 格式，请上传 Word 文档');return;}
  fname=file.name.replace(/\.docx$/i,'');
  document.getElementById('sourcePreview').innerHTML='<div class="empty"><div class="icon">⏳</div>正在解析文档结构...</div>';
  document.getElementById('formatPreview').innerHTML='<div class="empty"><div class="icon">⏳</div>等待解析完成...</div>';
  document.getElementById('toolbar').innerHTML='<span style="color:#bbb">⏳ 处理中...</span>';
  try{
    const raw=await extractParagraphs(file);
    if(raw.length===0){showError('sourcePreview','未能从文件中提取到文字内容，请确认文件包含文本段落');showError('formatPreview','无法生成预览');updateToolbar();return;}
    cur=analyze(raw);
    renderSource(cur);
    renderPreview(cur);
    updateToolbar();
    showToast('✅ 完成！检测到 '+raw.length+' 个段落 → '+cur.length+' 个内容块');
  }catch(e){
    console.error(e);
    showError('sourcePreview','解析失败：'+e.message+'<br><br>请确认：<br>① 文件为 .docx 格式（Word 2007+）<br>② 文件未损坏<br>③ 文件未被加密或设置权限密码');
    showError('formatPreview','解析失败');
    updateToolbar();
  }
}

async function doDownload(){
  if(!cur)return;
  const btn=document.getElementById('btnDownload');btn.disabled=true;btn.textContent='⏳ 生成中...';
  try{
    const blob=await buildDocxBlob(cur);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname+'_格式化.docx';document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    showToast('✅ 下载完成！请在 Word 中打开检查格式');
  }catch(e){console.error(e);showToast('❌ 生成失败：'+e.message);}
  finally{btn.disabled=false;btn.textContent='⬇ 导出格式化文档';}
}

function resetAll(){
  cur=null;fname='document';
  document.getElementById('sourcePreview').innerHTML='<div class="empty"><div class="icon">📂</div>上传 .docx 文件后显示层级检测结果</div>';
  document.getElementById('formatPreview').innerHTML='<div class="empty"><div class="icon">👁</div>上传文件后显示排版效果</div>';
  updateToolbar();document.getElementById('fileInput').value='';
}

// ── 事件绑定 ──
(function(){
  const dz=document.getElementById('dropZone');
  const fi=document.getElementById('fileInput');
  dz.addEventListener('click',function(e){e.stopPropagation();fi.click();});
  dz.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();dz.classList.add('dragover');});
  dz.addEventListener('dragleave',function(e){e.preventDefault();e.stopPropagation();dz.classList.remove('dragover');});
  dz.addEventListener('drop',function(e){e.preventDefault();e.stopPropagation();dz.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)processFile(f);});
  fi.addEventListener('change',function(){if(fi.files&&fi.files[0])processFile(fi.files[0]);});
  document.addEventListener('paste',function(e){const f=e.clipboardData&&e.clipboardData.files[0];if(f&&f.name.toLowerCase().endsWith('.docx')){e.preventDefault();processFile(f);}});
  updateToolbar();
  console.log('公文格式自动排版工具已就绪');
  console.log('使用方法：拖入 .docx 文件或点击上传区域');
})();
</script>
</body>
</html>
